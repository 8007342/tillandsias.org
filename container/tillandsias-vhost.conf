# tillandsias.org Apache vhost configuration
#
# Canonical host is the APEX tillandsias.org (shortest to type):
#   - https://tillandsias.org serves the site directly
#   - www.tillandsias.org 301-redirects to tillandsias.org (scheme-preserving)
#
# Loaded via Include from the official httpd config (conf/extra/).
# Requires mod_rewrite.

LoadModule rewrite_module modules/mod_rewrite.so

<VirtualHost *:80>
    ServerName tillandsias.org
    ServerAlias www.tillandsias.org

    ServerAdmin webmaster@tillandsias.org
    DocumentRoot "/usr/local/apache2/htdocs"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect www -> apex. The target scheme is hard-coded to https on purpose.
    #
    # This rule fires only for Host: www.tillandsias.org, which is a public
    # production hostname always reached through a TLS terminator (Cloudflare
    # today, a tunnel later). %{REQUEST_SCHEME} MUST NOT be used here: it
    # resolves to ap_http_scheme(r), which without mod_ssl and without a scheme
    # on ServerName is hard-coded to "http", so it would 301 an HTTPS visitor
    # down to plaintext for a round trip on every www request.
    #
    # Local development is unaffected — it never presents this Host header.
    #
    # Upgrade path, if this vhost ever needs to serve both schemes: enable
    # mod_remoteip with a trusted-proxy list and switch the target to
    # %{HTTP:X-Forwarded-Proto}. The trusted-proxy list is not optional — a
    # forwarded header is client-controlled unless the proxy is verified.
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\.tillandsias\.org$ [NC]
    RewriteRule ^(.*)$ https://tillandsias.org$1 [R=301,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
