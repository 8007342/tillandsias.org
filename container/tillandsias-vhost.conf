# tillandsias.org Apache vhost configuration
#
# Canonical host is the APEX tillandsias.org (shortest to type):
#   - https://tillandsias.org serves the site directly
#   - www.tillandsias.org 301-redirects to tillandsias.org (scheme-preserving)
#
# Loaded via Include from the official httpd config (conf/extra/).
# Requires mod_rewrite.

LoadModule rewrite_module modules/mod_rewrite.so

<VirtualHost *:80>
    ServerName tillandsias.org
    ServerAlias www.tillandsias.org

    ServerAdmin webmaster@tillandsias.org
    DocumentRoot "/usr/local/apache2/htdocs"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect www -> apex, preserving scheme (works for http dev and https prod).
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\.tillandsias\.org$ [NC]
    RewriteRule ^(.*)$ %{REQUEST_SCHEME}://tillandsias.org$1 [R=301,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
