  - id: 56435d54
    repo: tillandsias
    title: |
        `browser.open` cannot resolve a browser binary: the on-demand chromium installer has no consumer, and the chromium images are built but never run
    area: crates/tillandsias-browser-mcp/src/launcher.rs, scripts/install-chromium.sh, images/chromium/
    class: defect
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/litmus-tests/litmus-host-chromium-on-demand-shape.yaml` is green, and its name asserts that host chromium is installed on demand.
    code: |
        `crates/tillandsias-browser-mcp/src/launcher.rs#L67-L91` (`fn resolve_browser_binary`) accepts an explicit override, then `TILLANDSIAS_BROWSER_BIN`, then `TILLANDSIAS_CHROMIUM_BIN`, then looks only under the cache root (`~/.cache/tillandsias/chromium/current/chrome` and four siblings) and otherwise returns `LaunchError::BrowserUnavailable` — declared at `#L21` as "bundled chromium not yet downloaded". There is no `PATH` fallback to a system chrome/chromium.

        The only thing that would populate that directory is `scripts/install-chromium.sh`, and nothing invokes it. Outside the script itself, a repository-wide search for `install-chromium.sh` returns no caller anywhere under `crates/`, `scripts/` or `images/`; the only reference that runs is `openspec/litmus-tests/litmus-host-chromium-on-demand-shape.yaml`, whose steps (`#L33-L75`) are `grep` assertions over the script's own text. The shape test is green while the installer has no caller. (The repository already knows: `plan/index.yaml#L22893` carries a packet titled "scripts/install-chromium.sh has ZERO consumers … wire it or tombstone it", so check that packet's state before filing.)

        Separately, `images/chromium/Containerfile.core` and `Containerfile.framework` are wired into the build (`scripts/build-image.sh#L214-L215`, `crates/tillandsias-core/src/image_builder.rs#L329-L330`), but no Rust code launches either image — the only non-build references under `crates/` are build plumbing and status maps.
    why: |
        On a fresh host the whole host-browser MCP surface fails at its first call with an error that names a download step no code performs, and the litmus that is supposed to cover "host chromium on demand" cannot detect that because it only greps the installer's source. Meanwhile two multi-hundred-megabyte container images are built on every image pass and never started.
    fix: |
        Call `scripts/install-chromium.sh` from `resolve_browser_binary`'s miss path (or from the tray's first `browser.open`), add a `PATH` fallback for a system chromium, and add one step to the litmus that asserts a *caller* exists rather than only the script's text.
    evidence:
      - path: crates/tillandsias-browser-mcp/src/launcher.rs#L21
        quote: bundled chromium not yet downloaded
      - path: openspec/litmus-tests/litmus-host-chromium-on-demand-shape.yaml#L33-L75
        quote: command: "grep -F 'install_chromium()' scripts/install-chromium.sh && grep -F 'chromium_platform()' scripts/install-chromium.sh"
        note: Every step in this file's `critical_path` is a `grep` over `scripts/install-chromium.sh`'s own text; none asserts that anything calls the script.
      - path: plan/index.yaml#L22893
        quote: scripts/install-chromium.sh has ZERO consumers while its header claimed two integrations; a litmus pins a shape nothing ships — wire it or tombstone it
    depends_on:
    upstream: ""

  - id: 572f7388
    repo: tillandsias
    title: |
        The safe-browser launcher defaults to host networking; its spec promises enclave-only egress through the proxy
    area: scripts/launch-chromium.sh, spec chromium-safe-variant
    class: spec-vs-code
    severity: high
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/chromium-safe-variant/spec.md#L18-L19` — "Full network isolation inside the enclave, with allowlist enforcement via the proxy only; no host-gateway internet fallback"; and `#L137-L138` — "**THEN** it SHALL connect through the enclave network **AND** all web egress SHALL traverse the proxy/allowlist path".
    code: |
        `run-safe-browser.sh` execs `scripts/run-safe-browser.sh`, which execs `scripts/launch-chromium.sh safe-browser "$URL" 9222 open_safe_window` (`scripts/run-safe-browser.sh#L42`). That script's podman argv is built at `scripts/launch-chromium.sh#L84-L98`, and line 90 reads:

        "--network=${TILLANDSIAS_BROWSER_NETWORK:-host}"

        Neither wrapper sets `TILLANDSIAS_BROWSER_NETWORK` — the string does not appear in either file — so the documented entry point for the "safe" variant launches the browser in the host network namespace, with direct internet access and no proxy in the path. The surrounding flags (`--cap-drop=ALL`, `--security-opt=no-new-privileges`, `--read-only`, tmpfs mounts) are all correctly applied; only the network default contradicts the spec.
    why: |
        The variant's name and its spec both say the containment is network containment, and that is the one control the default turns off. A user running `./run-safe-browser.sh --url …` gets a hardened-but-unisolated browser while every other property the spec lists is genuinely enforced, which is the hardest kind of gap to notice.
    fix: |
        Default to `tillandsias-enclave` (`:-tillandsias-enclave`) and keep `host` reachable only by explicitly setting `TILLANDSIAS_BROWSER_NETWORK`.
    evidence:
      - path: scripts/launch-chromium.sh#L90
        quote: '"--network=${TILLANDSIAS_BROWSER_NETWORK:-host}"'
      - path: openspec/specs/chromium-safe-variant/spec.md#L18-L19
        quote: Full network isolation inside the enclave, with allowlist enforcement via the proxy only; no host-gateway internet fallback
    depends_on:
    upstream: ""

  - id: 5f323a37
    repo: tillandsias
    title: |
        The Windows tray reads the secure-wire variable directly, the single-reader ratchet has two slots of slack, and the WSL guest unit never receives the flag
    area: crates/tillandsias-windows-tray/src/hvsocket.rs, scripts/check-secure-wire-single-reader.sh, crates/tillandsias-vm-layer/src/wsl.rs
    class: defect
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `scripts/check-secure-wire-single-reader.sh#L3-L5` — "`TILLANDSIAS_SECURE_CONTROL_WIRE` has ONE reader, and this ratchets the number of files that name it down, never up." `#L39` sets `BASELINE="${TILLANDSIAS_SECURE_WIRE_READER_BASELINE:-3}"`, and `#L37-L38` says "Lower this as each is converted; it must never rise. 0 means the flip may land."
    code: |
        At this tag exactly one file outside the owning module still reads the variable — `crates/tillandsias-windows-tray/src/hvsocket.rs#L29`, `if std::env::var("TILLANDSIAS_SECURE_CONTROL_WIRE").as_deref() == Ok("on")`, i.e. the case-sensitive byte comparison the guard's own header (`#L15-L20`) identifies as the behaviour that made `On` silently plaintext. So the count is 1 against a baseline of 3: two more direct readers could be added, with two more private interpretations of the value, and the guard would still print `ok`.

        The other half is that the flag never reaches the Windows-side server. `crates/tillandsias-vm-layer/src/vz.rs#L859` injects `Environment=TILLANDSIAS_SECURE_CONTROL_WIRE=__SECURE_CONTROL_WIRE__` into the macOS guest's systemd unit; the WSL equivalent, `fn headless_unit` (`crates/tillandsias-vm-layer/src/wsl.rs#L90-L110`), writes only `Environment=HOME=/root` and `Environment=XDG_RUNTIME_DIR=/run/user/0`. The guest headless therefore always runs with the variable unset, so even a tray told `on` would hand a Noise handshake to a server that is not expecting one — which is precisely the one-sided flip the guard's header records as having already happened once (`#L23-L27`, flipped at e6a80609f, reverted at 08a7d3cc7).

        Worth recording alongside: the PSK root is `release_root_secret()` (`crates/tillandsias-secure-channel/src/lib.rs#L86-L101`), which on debug builds is the literal `b"tillandsias-dev-root-not-a-secret"` (`#L68`) and on release builds is the SHA-256 of the shipped binary. Both are values an attacker holding a public artifact can compute, so the channel provides version binding, not confidentiality against anyone who has the release. The source comments say this plainly; the word "secret" in the function name does not.
    why: |
        A ratchet with slack is not a ratchet: the guard prints `ok` while two more private readers of the flag may still be added. And the flip the whole mechanism exists to make safe cannot succeed today, because the WSL guest unit never carries the variable, so a tray told `on` would speak Noise at a server that is not.
    fix: |
        Lower `BASELINE` to 1 now (it can only be lowered honestly if it tracks reality), convert `hvsocket.rs` to `tillandsias_control_wire::secure_wire_mode`, and add the `TILLANDSIAS_SECURE_CONTROL_WIRE` line to `wsl.rs`'s `headless_unit` before the default is flipped.
    evidence:
      - path: scripts/check-secure-wire-single-reader.sh#L39
        quote: BASELINE="${TILLANDSIAS_SECURE_WIRE_READER_BASELINE:-3}"
      - path: crates/tillandsias-windows-tray/src/hvsocket.rs#L29
        quote: if std::env::var("TILLANDSIAS_SECURE_CONTROL_WIRE").as_deref() == Ok("on")
      - path: crates/tillandsias-vm-layer/src/wsl.rs#L90-L110
        quote: 'Environment=HOME=/root\n\ Environment=XDG_RUNTIME_DIR=/run/user/0\n\'
        note: These are the unit's only two `Environment=` directives, and `TILLANDSIAS_SECURE_CONTROL_WIRE` appears nowhere in `wsl.rs`, so the WSL guest headless always runs with the flag unset.
    depends_on:
    upstream: ""

  - id: 83309118
    repo: tillandsias
    title: |
        README's release ledger has no row for v56.9.5.1
    area: README.md
    class: stale-record
    severity: low
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `README.md#L107` — "The release skill appends a row per release; STABLE marks channel promotions." The ledger table header is at `#L112`.
    code: |
        The newest row is `v56.9.4.1` (`#L114`), then `v56.9.2.1` (`#L115`), then `v56.8.31.3` (`#L116`). The string `56.9.5.1` does not appear anywhere in `README.md`, while `VERSION` at this tag reads `56.9.5.1`.

        The source section records this as class `stale-plan-entry`; the ledger's nearest class is `stale-record`.
    why: |
        The ledger is explicitly addressed to agents ("Agents doing smoke curl-installs or jumpstarting work read the recent rows first", `README.md#L103-L104`), so an agent on the newest daily reads a ledger whose newest entry is a different release and has no way to see what changed under it. It is also the mechanism by which this site's explanation pages decide what a release shipped.
    fix: |
        Append the `v56.9.5.1` row, or make the release skill's ledger append a gated step rather than a convention.
    evidence:
      - path: README.md#L107
        quote: The release skill appends a row per release; STABLE marks channel promotions.
      - path: README.md#L110
        quote: <summary>Release ledger (newest first)</summary>
      - path: README.md#L114
        quote: v56.9.4.1 (daily — cut 2026-09-04 by the coordinator's 20:09Z meta cycle, PR #105 merge + bump PR;
        note: The first data row under the table header at `#L112-L113`; the next two rows are `v56.9.2.1` (`#L115`) and `v56.8.31.3` (`#L116`). The string `56.9.5.1` appears nowhere in `README.md`, while `VERSION` at this tag reads `56.9.5.1`.
    depends_on:
    upstream: ""

  - id: 984bf6cc
    repo: tillandsias
    title: |
        The published `stable` git tag points at a stale commit
    area: git tags, release promotion
    class: stale-record
    severity: low
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        The `stable` git tag is the channel pointer a reader (and this site's pins) treats as naming the current stable release.
    code: |
        What IS observable here: the runtime mirror this site audits from carries no `stable` ref at all. `git for-each-ref` over the v56.9.5.1 worktree lists `refs/tags/latest`, `refs/tags/unstable`, `refs/tags/v56.9.2.1` and `refs/tags/v56.9.5.1`, and `git rev-parse stable` fails with `unknown revision`. The release ledger names v56.9.2.1 as the most recent STABLE promotion (`README.md#L115`), so that is the release a correct channel pointer resolves to.

        What is NOT observable here: where the published `stable` tag on the origin actually points, and why. That half is a report from the fleet coordinator, carried in the evidence notes rather than asserted as a verified finding, and it is recorded so a reader of the source audit does not open a duplicate.
    why: |
        A channel tag that names the wrong commit misdirects anyone resolving `stable` — including this site's release pins — and the correction is an operator action rather than a code change.
    fix: |
        Operator decision: move the published `stable` tag, and make promotion tag the pushed release commit rather than the promoting checkout's local main.
    evidence:
      - path: README.md#L115
        quote: v56.9.2.1 (**STABLE** — cut and promoted 2026-09-02 unattended, operator-authorized while asleep; PRs #103 merge + #104 bump;
        note: The ledger's most recent STABLE promotion, and therefore the release a correct `stable` tag names.
      - note: Observable, not a quotation - at v56.9.5.1 `git for-each-ref` lists only refs/tags/latest, refs/tags/unstable, refs/tags/v56.9.2.1 and refs/tags/v56.9.5.1, and `git rev-parse stable` returns `unknown revision`. The mirror carries no `stable` ref, so the published tag's target cannot be read from this checkout.
      - note: NOT verified here - reported to the fleet coordinator on 2026-09-05, which replied that it is filed as a p3 packet, that the cause was promotion tagging the promoting checkout's local main, and that moving the published tag is an operator decision. Recorded in this site repository at `docs/audit/2026-09-05-issues-tillandsias.md`.
    depends_on:
    upstream: ""

