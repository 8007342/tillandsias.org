issues:
  - id: 5e0a299e
    repo: tillandsias
    title: |
        `run_provider_login` attaches a container to the enclave without being a documented member, and the membership guard cannot see it
    area: crates/tillandsias-headless/src/main.rs, scripts/check-enclave-membership-documented.sh, spec enclave-network
    class: spec-vs-code
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/enclave-network/spec.md#L45-L60` — "The attach sites are these run-argument builders, named by SYMBOL so the list survives every edit that does not rename one … A new enclave member MUST be added to this list in the same commit that attaches it; `scripts/check-enclave-membership-documented.sh` refuses the divergence in both directions."
    code: |
        `crates/tillandsias-headless/src/main.rs#L9728` and `#L9764` — inside `fn run_provider_login` (defined at `#L9607`), two `podman run` invocations pass `"--network", ENCLAVE_ONLY_NET`. `run_provider_login` is not in the spec's twelve-symbol list.

        The guard cannot report it. `scripts/check-enclave-membership-documented.sh#L71` — `if (fname ~ /^(build|launch)_/) { print fname }`. Only enclosing functions whose names begin `build_` or `launch_` are counted, so a production attach site in any other function is filtered out before the comparison runs. The same name filter is also silently doing the job the header at L59-L61 attributes to something else: that header says "The `#[cfg(test)]` region is cut before scanning", and no such cut exists anywhere in the script.
    why: |
        The spec's stated guarantee is that the membership list cannot drift silently, and its own text explains that a hand-maintained prose list had already gone stale by six members. The replacement mechanism reproduces the failure one level down: this attach site has been undetectable since the guard landed, and the spec's "Only the proxy MUST additionally be attached to the egress network" is stated against a list that is missing a member. The guard's own header even acknowledges a second dual-homed member ("the dual-homed pair (proxy, and the login helper)") that the spec text denies.
    fix: |
        Drop the `^(build|launch)_` name filter (cutting the real `#[cfg(test)]` region instead, as the header already claims), then add `run_provider_login` to the spec's membership list or route it through a named builder.
    evidence:
      - path: openspec/specs/enclave-network/spec.md#L45-L60
        quote: A new enclave member MUST be added to this list in the same commit that attaches it; `scripts/check-enclave-membership-documented.sh` refuses the divergence in both directions.
      - path: crates/tillandsias-headless/src/main.rs#L9727-L9728
        quote: "--network", ENCLAVE_ONLY_NET,
        note: The same pair appears again at `#L9763-L9764`, in the second `podman run` this function builds. `run_provider_login` is in neither the spec's membership list nor the guard's `^(build|launch)_` name filter.
      - path: scripts/check-enclave-membership-documented.sh#L71
        quote: if (fname ~ /^(build|launch)_/) { print fname }
    depends_on:
    upstream: ""

  - id: 5e3a98f3
    repo: tillandsias
    title: |
        The enclave-network spec's cleanup-on-exit and lifecycle-telemetry requirements have no implementation
    area: spec enclave-network, crates/tillandsias-headless/src/main.rs
    class: spec-vs-code
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/enclave-network/spec.md#L31-L34` — "**WHEN** the Tillandsias application exits **AND** no containers are attached … **THEN** the system MUST remove the network with `podman network rm tillandsias-enclave`". And `#L80-L86` — "**THEN** the system MUST log `[enclave] Network created: tillandsias-enclave`" / "`[enclave] Container attached: <name>`", both with `@trace spec:enclave-network`.
    code: |
        `graceful_shutdown_async` at `crates/tillandsias-headless/src/main.rs#L16652` stops `tillandsias-`-prefixed containers and never touches a network. The only `network rm` in the crate is `#L8845`, inside `run_reset_guest` — the explicit `--reset-guest` wipe, not an exit path. `PodmanClient::remove_network` (`crates/tillandsias-podman/src/client.rs#L975`) has no production caller: the only references are `crates/tillandsias-podman-cli/src/lib.rs#L479` (the scenario tool) and a `let _ =` liveness reference at `client.rs#L3374`. The two mandated log strings — `Network created` and `Container attached` — do not appear anywhere under `crates/`, `scripts/` or `images/`.
    why: |
        Two of the four scenarios under the spec's primary requirement, and both scenarios of its telemetry requirement, describe behaviour that does not exist. The network persists across every exit, which is also what makes the `--internal` installed-base gap permanent rather than self-healing, and the `--log-enclave` accountability window the spec promises is empty for enclave lifecycle events.
    fix: |
        Either implement the exit-time `podman network rm` (guarded on zero attached containers) and the two log lines, or mark both requirements `deferred` with the reason, so the spec stops asserting them.
    evidence:
      - path: openspec/specs/enclave-network/spec.md#L31-L34
        quote: '**THEN** the system MUST remove the network with `podman network rm tillandsias-enclave`'
      - path: openspec/specs/enclave-network/spec.md#L80-L86
        quote: '**THEN** the system MUST log `[enclave] Network created: tillandsias-enclave`'
      - path: crates/tillandsias-podman/src/client.rs#L970-L975
        quote: Uses `podman network rm -f` so any lingering attached container (e.g. an exited forge that wasn't yet `podman rm`-ed) does not block teardown. The `-f` flag disconnects attached containers before removing the network, which is exactly the behaviour the shutdown path wants — we've already stopped those containers, we just want the network gone.
        note: The shutdown path this doc comment describes does not exist. `PodmanClient::remove_network` has no production caller at this tag - the only references in the tree are `crates/tillandsias-podman-cli/src/lib.rs#L479` (the scenario tool) and the `let _ = PodmanClient::remove_network;` liveness reference at `client.rs#L3374`.
    depends_on:
    upstream: ""

  - id: 6cd2f616
    repo: tillandsias
    title: |
        The permissive proxy port grants unfiltered egress to every enclave member with no source restriction
    area: images/proxy/squid.conf, spec proxy-container
    class: defect
    severity: high
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/proxy-container/spec.md#L104` — the dual-port table lists port 3129 as "Permissive | All domains allowed", and `#L112-L114`: "**WHEN** a request is sent through port 3129 **THEN** all domains on SSL ports (443, 8443) SHALL be permitted **AND** domain filtering SHALL NOT apply."
    code: |
        `images/proxy/squid.conf#L60` — `http_port 3129 ssl-bump \` with no bind address, so squid listens on `0.0.0.0:3129` on every interface the container has. `#L133-L134` — `http_access allow CONNECT SSL_ports build_port` / `http_access allow build_port`, with `build_port` defined at `#L93` as `acl build_port localport 3129` and no source ACL anywhere in the file. The container is dual-homed: `crates/tillandsias-headless/src/main.rs#L3425-L3426` passes `--network ENCLAVE_EGRESS_NETS` (= `"tillandsias-enclave,tillandsias-egress"`, `#L1651`), so the listener is reachable from both networks.
    why: |
        Every enclave container is handed `http_proxy=http://proxy:3128` (`main.rs#L1711-L1717`), but nothing prevents any of them from using `http://proxy:3129` instead and reaching the internet with the allowlist skipped entirely. The port's own header comment (`squid.conf#L6-L45`) is careful and honest about the port having no consumer today, and `scripts/check-proxy-permissive-port-routing.sh` pins that honesty — but "no consumer" is a statement about Tillandsias's own code, not about what an agent inside a forge can dial. Filtering that a client can opt out of by changing a port number is not a boundary, and the explanation pages describe the allowlist as one.
    fix: |
        Bind the permissive listener to loopback (`http_port 127.0.0.1:3129 …`) so it is unreachable from the enclave, or add a source ACL restricting it, until a real consumer exists.
    evidence:
      - path: images/proxy/squid.conf#L60
        quote: http_port 3129 ssl-bump \
      - path: images/proxy/squid.conf#L93
        quote: acl build_port localport 3129
      - path: crates/tillandsias-headless/src/main.rs#L3425-L3426
        quote: "--network".into(), ENCLAVE_EGRESS_NETS.into(),
        note: `ENCLAVE_EGRESS_NETS` is `"tillandsias-enclave,tillandsias-egress"` (`main.rs#L1651`), so the proxy container is dual-homed and its 3129 listener is reachable from the enclave network.
    depends_on:
    upstream: ""

  - id: 467f07ba
    repo: tillandsias
    title: |
        The proxy CA is one persistent RSA-2048 30-day certificate; the spec promises a per-launch two-level EC P-256 chain on tmpfs
    area: spec proxy-container, crates/tillandsias-headless/src/main.rs, images/default/ca-path.txt
    class: spec-vs-code
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/proxy-container/spec.md#L66` — "The system SHALL generate a fresh two-level CA chain on every proxy launch. The chain SHALL consist of a self-signed Root CA and an Intermediate CA signed by the root, both using EC P-256 keys. All key material SHALL be stored on tmpfs (`$XDG_RUNTIME_DIR/tillandsias/proxy-certs/`) and SHALL be destroyed when the session ends (logout/reboot). No CA keys SHALL persist to disk." The four-file table below it names `root.crt`, `intermediate.crt`, `intermediate.key`, `ca-chain.crt`, each with lifetime "Session (tmpfs)", and a scenario requires generation "in under 10ms (EC P-256 key generation)". The spec's Status is `active` with no stale or superseded marker.
    code: |
        `crates/tillandsias-headless/src/main.rs#L3170-L3189` (`fn ensure_ca_bundle`) shells out to `openssl req -x509 -newkey rsa:2048 … -days 30 -nodes -subj "/C=US/ST=Privacy/L=Local/O=Tillandsias/CN=Tillandsias CA"` — one self-signed RSA-2048 certificate valid 30 days, not a two-level EC P-256 chain. It is not per-launch: `ca_bundle_needs_refresh` (`#L3055-L3068`) returns false while both files are under 25 days old, so a launch reuses the existing key. And it is deliberately not on tmpfs: the directory comes from `tillandsias_core::ca_path::ca_dir()`, whose single-source manifest `images/default/ca-path.txt` declares `${HOME}/.local/state/tillandsias` and explains at length that a durable location was chosen by measurement because "/tmp works everywhere and is the bug" — a reboot on a volatile path made the proxy permanently unrestartable (order 975-rsgm).
    why: |
        The code is right and the spec is wrong, which is the worse direction: the spec is the artifact a reader (or an auditing agent, or this site) treats as the contract, and it currently promises ephemerality that the implementation deliberately abandoned for a documented reason. "No CA keys SHALL persist to disk" is a security claim, and the CA private key persists to `$HOME/.local/state/tillandsias/ca/intermediate.key` for up to 25 days.
    fix: |
        Rewrite the "Ephemeral CA chain (per-launch generation)" requirement to describe the durable single-certificate design and its 25-day refresh, citing `images/default/ca-path.txt` for why the path is not tmpfs.
    evidence:
      - path: openspec/specs/proxy-container/spec.md#L66
        quote: All key material SHALL be stored on tmpfs (`$XDG_RUNTIME_DIR/tillandsias/proxy-certs/`) and SHALL be destroyed when the session ends (logout/reboot). No CA keys SHALL persist to disk.
      - path: crates/tillandsias-headless/src/main.rs#L3170-L3175
        quote: let mut command = Command::new("openssl"); command.args([ "req", "-x509", "-newkey", "rsa:2048",
      - path: crates/tillandsias-headless/src/main.rs#L3184-L3188
        quote: "-days", "30", "-nodes", "-subj", "/C=US/ST=Privacy/L=Local/O=Tillandsias/CN=Tillandsias CA",
        note: One self-signed RSA-2048 certificate valid 30 days, where the spec requires a two-level EC P-256 chain regenerated on every proxy launch.
      - path: images/default/ca-path.txt
        quote: /tmp works everywhere and is the bug
    depends_on:
    upstream: ""

  - id: 71e14b04
    repo: tillandsias
    title: |
        Denied runtime traffic gets a TCP reset; the proxy spec says HTTP 403 twice
    area: spec proxy-container, images/proxy/squid.conf
    class: spec-vs-code
    severity: low
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/proxy-container/spec.md#L53` — "**THEN** the proxy SHALL deny the request with HTTP 403"; and again at `#L109` — "**AND** all other domains SHALL be denied with HTTP 403". A third scenario (`#L186-L188`) requires that "the proxy response SHALL include the blocked domain name for debugging".
    code: |
        `images/proxy/squid.conf#L137-L141` — `acl strict_deny_acl localport 3128` followed by `deny_info TCP_RESET strict_deny_acl`, with the inline rationale "Send a TCP reset instead of an HTTP 403 error for strictly-denied runtime traffic. This prevents sophisticated tunneling/exfiltration over denied connections."
    why: |
        The behaviours are not interchangeable for a client: a 403 carries a body naming the blocked domain (which a third scenario in the same spec requires), a TCP reset carries nothing. Anyone debugging a blocked domain from inside a forge, or writing a test against the spec, is told to expect a status code that never arrives. The deliberate choice recorded in the config is the right one; the spec has simply not been updated to it.
    fix: |
        Change the two `HTTP 403` scenarios to `TCP_RESET` on port 3128, and either drop or re-scope the "response SHALL include the blocked domain" scenario, which a reset cannot satisfy.
    evidence:
      - path: openspec/specs/proxy-container/spec.md#L53
        quote: '**THEN** the proxy SHALL deny the request with HTTP 403'
      - path: images/proxy/squid.conf#L137
        quote: acl strict_deny_acl localport 3128
      - path: images/proxy/squid.conf#L138-L139
        quote: Send a TCP reset instead of an HTTP 403 error for strictly-denied runtime traffic. This prevents sophisticated tunneling/exfiltration over denied connections.
      - path: images/proxy/squid.conf#L141
        quote: deny_info TCP_RESET strict_deny_acl
    depends_on:
    upstream: ""

  - id: 34460f90
    repo: tillandsias
    title: |
        The hardening litmus header says the argv validator has zero production call sites; it has three
    area: openspec/litmus-tests/litmus-podman-idiomatic-security-flags.yaml
    class: doc-drift
    severity: low
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/litmus-tests/litmus-podman-idiomatic-security-flags.yaml#L66-L71` — "WHAT IT STILL DOES NOT COVER … that every production launch site actually APPLIES the envelope. The validator that would answer this — `validate_launch_argv` in the same module — has zero production call sites, which is order 972-6vaj's subject, not this file's."
    code: |
        At this tag `validate_launch_argv` (`crates/tillandsias-podman/src/policy.rs#L110`) has three non-test callers: `crates/tillandsias-podman/src/container_spec.rs#L396` inside `fn build_run_argv`, and `crates/tillandsias-headless/src/main.rs#L11711` and `#L11877`. `container_spec.rs#L379-L384` documents the change explicitly ("THIS WAS A `debug_assert!` AND THEREFORE NOTHING … the validator had zero production call sites"), i.e. the header describes the state 972-6vaj fixed.
    why: |
        This is the file a reader consults to learn what the hardening gate does and does not prove, and it is currently more pessimistic than the truth in a way that hides the real remaining gap (see finding da34e5ee). A stale disclaimer in a security fixture is read as current fact.
    fix: |
        Replace the paragraph with the current state: the validator now guards `ContainerSpec::build_run_argv` and the two delegated-run entry points, and name the launch paths that still bypass it.
    evidence:
      - path: openspec/litmus-tests/litmus-podman-idiomatic-security-flags.yaml#L66-L71
        quote: The validator that would answer this — `validate_launch_argv` in the same module — has zero production call sites, which is order 972-6vaj's subject, not this file's.
      - path: crates/tillandsias-podman/src/container_spec.rs#L394-L397
        quote: crate::policy::validate_launch_argv(&argv)?;
        note: This call, inside `fn build_run_argv`, is one of three non-test call sites at this tag; the other two are `crates/tillandsias-headless/src/main.rs#L11711` and `#L11877`. The litmus header's "zero production call sites" describes the state order 972-6vaj fixed.
    depends_on:
      - da34e5ee
    upstream: ""

  - id: da34e5ee
    repo: tillandsias
    title: |
        Five production container launches never reach `validate_launch_argv`, and one of them builds an argv the policy forbids
    area: crates/tillandsias-headless/src/main.rs, crates/tillandsias-podman/src/container_spec.rs
    class: defect
    severity: high
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `crates/tillandsias-headless/src/main.rs#L11681-L11688` — "VERIFIED 2026-09-04: this function's only production caller is `run_agent_container_attached`, which validates first; its four other callers are inside `mod tests` … **Every production container launch therefore already passes `validate_launch_argv`.**" A second doc comment at `#L14177` states "Every option flows through the policy-validated `build_run_argv()` path".
    code: |
        `ContainerSpec` has two serializers: `build_run_argv()` validates (`container_spec.rs#L394-L397`), `build_run_args()` does not (`#L274`). These production paths use the unvalidated one, or build argv by hand and hand it straight to `PodmanClient::run_container_observed` (`crates/tillandsias-podman/src/client.rs#L1022`), which performs no validation:

        - the egress proxy — `main.rs#L3414` `fn build_proxy_run_args` returns a raw `Vec<String>`, launched at `#L3526`;
        - the git mirror — `main.rs#L4284` `fn build_git_run_args`, launched at `#L9087`;
        - the observatorium web container — `main.rs#L11246` `.build_run_args()`;
        - the project browser — `main.rs#L11295` and `#L13047` `spec.build_run_args()`;
        - the interactive forge — `build_forge_agent_run_args_with_vault` ends at `#L14736` with `spec.build_run_args()`, and `build_forge_agent_run_argv` (`#L14741`) merely prefixes `podman run` before `launch_forge_agent` (`#L15089`) spawns it in a host terminal emulator. This is the path the `#L14177` doc comment describes, and it never calls the validator.

        And the gap is not theoretical. `fn run_provider_login` (`main.rs#L9607`) launches a container at `#L9722-L9740` with `--cap-drop=ALL`, `--security-opt=no-new-privileges` and `--userns=keep-id` — but **not** `--security-opt=label=disable`, which `policy.rs#L17-L22` (`MANDATORY_HARDENING_FLAGS`) declares mandatory. `validate_launch_argv` would return `MissingMandatoryHardening(["--security-opt=label=disable"])` for that argv. Nothing calls it there, so the launch proceeds.
    why: |
        The project's own framing (`container_spec.rs#L385-L392`) is that an argv missing a hardening flag "is not a degraded launch to be reported, it is a container that must not be created". At this tag that guarantee holds for exactly the delegated-agent lanes, while the proxy, the mirror, the observatorium, the browser and the interactive forge — the containers a user actually runs — are outside it, and there is already one production argv the policy would reject.
    fix: |
        Route every builder through `build_run_argv()` (or call `validate_launch_argv` in `run_container_observed` / `run_container_attached_observed` so no launcher can bypass it), fix `run_provider_login`'s missing flag, and correct the two doc comments.
    evidence:
      - path: crates/tillandsias-headless/src/main.rs#L11684-L11688
        quote: VERIFIED 2026-09-04: this function's only production caller is `run_agent_container_attached`, which validates first; its four other callers are inside `mod tests` (which begins at the #[cfg(test)] at line 16663, and all four sit past it). Every production container launch therefore already passes `validate_launch_argv`.
      - path: crates/tillandsias-headless/src/main.rs#L9734-L9736
        quote: "--cap-drop=ALL", "--security-opt=no-new-privileges", "--userns=keep-id",
        note: `--security-opt=label=disable`, which `crates/tillandsias-podman/src/policy.rs#L17-L22` (`MANDATORY_HARDENING_FLAGS`) declares mandatory, is absent from this argv, and nothing on this path calls `validate_launch_argv`.
      - path: crates/tillandsias-podman/src/container_spec.rs#L385-L392
        quote: is not a degraded launch to be reported, it is a container that must not be created
    depends_on:
    upstream: ""

  - id: 30127aad
    repo: tillandsias
    title: |
        The macOS release lane signs a hardcoded three-asset list and runs no transitive integrity check
    area: .github/workflows/release.yml
    class: defect
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/binary-signing/spec.md#L17-L18` — "**WHEN** a release contains the Linux musl binary and installer helper scripts **THEN** each signable artifact MUST have its own `.cosign.bundle` file".
    code: |
        The Linux lane discovers what to sign and then proves the property over whatever was staged: `.github/workflows/release.yml#L264-L268` loops `for artifact in *` (skipping only `SHA256SUMS` and existing bundles), and `#L293` runs `bash ../scripts/check-release-asset-integrity.sh .`, whose own header (`scripts/check-release-asset-integrity.sh#L14-L20`) exists precisely because "the Windows job's signing loop was an ALLOW-LIST".

        The macOS lane at `#L507-L518` is that allow-list:

        for artifact in tillandsias-tray-*-macos-arm64.tar.gz Tillandsias.dmg install-macos.sh; do

        `SHA256SUMS-macos` — staged at `#L501` — is not in the list and gets no `.cosign.bundle`. And `check-release-asset-integrity.sh` is invoked in only two jobs (`#L293` Linux, `#L772` Windows); the macOS job does not run it.
    why: |
        The integrity guard was written after an asset shipped unverifiable for exactly this reason, and the lane that reproduces the pattern is the one it is not wired into. `scripts/install-macos.sh#L106-L128` downloads `SHA256SUMS-macos` and trusts it as the sole integrity source for the tarball — a manifest with no signature of its own. Any asset added to the macOS lane later inherits the same silence.
    fix: |
        Replace the three-name glob with the Linux lane's `for artifact in *` form and add `bash scripts/check-release-asset-integrity.sh release-artifacts` to the macOS job.
    evidence:
      - path: .github/workflows/release.yml#L507-L518
        quote: for artifact in tillandsias-tray-*-macos-arm64.tar.gz Tillandsias.dmg install-macos.sh; do
      - path: scripts/check-release-asset-integrity.sh#L14-L20
        quote: the Windows job's signing loop was an ALLOW-LIST
      - path: scripts/install-macos.sh#L106-L108
        quote: SHA_URL="${BASE}/SHA256SUMS-macos"
      - path: scripts/install-macos.sh#L123-L127
        quote: EXPECTED="$(grep -F "  $ASSET_NAME" "$TMP/SHA256SUMS-macos" | awk '{print $1}')"
        note: The manifest the installer trusts is the one asset the macOS signing loop does not sign, and no install path fetches or verifies a `.cosign.bundle`.
    depends_on:
    upstream: ""

  - id: b28aba62
    repo: tillandsias
    title: |
        No default install path verifies a Cosign bundle, and the Linux installer continues when the checksum file is missing
    area: scripts/install.sh, scripts/install-macos.sh, scripts/install-windows.ps1, spec update-system
    class: defect
    severity: high
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/binary-signing/spec.md#L27-L30` — "All signable release artifacts MUST be signed with Cosign keyless mode and MUST be verifiable locally using the bundle format." Verification itself is placed on the user: `#L45-L52` requires only that the *instructions* and `scripts/verify.sh` use `cosign verify-blob --bundle`.
    code: |
        `cosign` appears in no installer. `scripts/verify.sh` is the only consumer (`#L46`, `#L78`), and it is an opt-in helper the install path never calls. The three install scripts stop at SHA-256: `scripts/install.sh#L226-L239`, `scripts/install-macos.sh#L106-L128`, `scripts/install-windows.ps1#L361-L390`.

        `scripts/install.sh` additionally proceeds on every failure of that weaker check — `#L232` "sha256sum not found; skipping checksum verification.", `#L235` "SHA256SUMS did not contain $ASSET; skipping checksum verification.", `#L238` "SHA256SUMS not available; skipping checksum verification." — and then installs the downloaded bytes at `#L243`. (`install-macos.sh` and `install-windows.ps1` do die on a missing manifest; only the Linux path degrades open.)

        `openspec/specs/update-system/spec.md` — the spec governing how a running install obtains a new artifact — contains one requirement, "Platform-appropriate artifact selection", and the strings `cosign`, `verify`, `signature` and `checksum` do not appear in it at all.
    why: |
        The signing story the spec tells is only ever exercised by an opt-in helper, so the default path a user actually runs verifies nothing stronger than a checksum — and on Linux not even that, because every failure of the checksum step is a warning followed by an install of the downloaded bytes. The spec that governs how a running install fetches a new artifact does not mention verification at all.
    fix: |
        Make `install.sh` fail closed when `SHA256SUMS` is missing or does not name the asset, and add a signature-verification requirement to `openspec/specs/update-system/spec.md` (verify the bundle when `cosign` is present, refuse or warn loudly when it is not).
    evidence:
      - path: scripts/install.sh#L238
        quote: SHA256SUMS not available; skipping checksum verification.
      - path: openspec/specs/binary-signing/spec.md#L27-L30
        quote: All signable release artifacts MUST be signed with Cosign keyless mode and MUST be verifiable locally using the bundle format.
      - path: openspec/specs/update-system/spec.md#L8-L14
        quote: The updater SHALL select the correct artifact for the current platform and handle platform-specific execution constraints.
        note: This is the file's only requirement, and a case-insensitive search of the whole file for `cosign`, `verify`, `signature` and `checksum` returns nothing - the spec governing how a running install obtains a new artifact does not mention verification at all.
    depends_on:
    upstream: ""

  - id: 62cacffe
    repo: tillandsias
    title: |
        The Vault unseal share persists to a plain file that satisfies the "share in keychain" check, contradicting the tmpfs-only invariant, and `--reset-guest` leaves it behind
    area: crates/tillandsias-headless/src/vault_bootstrap.rs, crates/tillandsias-headless/src/main.rs, spec tillandsias-vault
    class: spec-vs-code
    severity: high
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        `openspec/specs/tillandsias-vault/spec.md#L391-L393` — "### Invariant: Unseal key is tmpfs-only … **Expression**: `/run/secrets/vault-unseal IS_ON tmpfs AND NEVER persisted to disk`". `#L88-L91` adds that "the host launcher captures the random Vault-generated share on first boot, persists it in the host keychain, and deletes all local on-disk copies".
    code: |
        `crates/tillandsias-headless/src/vault_bootstrap.rs#L1295-L1322` (`fn write_vm_credential_fallbacks`) writes the base64 Shamir share with `fs::write(cache_dir.join(format!("fallback_{VAULT_SHAMIR_SHARE_V1}")), share_b64)`. `cache_dir` is `crate::init_cache_dir()` (`main.rs#L2011-L2028`), which resolves to `$XDG_CACHE_HOME/tillandsias` or `$HOME/.cache/tillandsias` — ordinary durable disk. The write is unconditional whenever the host delivers a share into the guest (`vault_bootstrap.rs#L108-L124`), and its doc comment says so plainly: the file "is the ONLY evidence inside the guest that `operator init` ever completed".

        That file is also what answers the "is the share in the keychain?" question. `has_shamir_share_in_keyring` (`#L1345-L1372`) tries the OS keychain, then falls through to `fs::read_to_string(cache_dir.join(format!("fallback_{}", VAULT_SHAMIR_SHARE_V1)))` and returns true if it base64-decodes to 32 bytes — so the predicate that guards the partial-init wipe is satisfied by a file, not by a keychain.

        Nothing deletes it. There is no `remove_file` / `delete` of any `fallback_*` path anywhere under `crates/`. And `--reset-guest`, documented at `main.rs#L1430` as an "EPHEMERAL RESET: wipe the guest substrate", removes containers, volumes, podman secrets and networks (`main.rs#L8803-L8848`) and then exactly one host path — `reset_guest_wipe_paths` (`#L8746-L8748`) returns `vec![cache_dir.join("vault-data")]`. The share file sits in the same directory and survives. `--reset-guest` also never touches the OS keychain: the only `delete_credential` call in the crate is `vault_bootstrap.rs#L1924`, inside `fn sanitize_keychain`, and it deletes only the legacy `vault-unseal-v1` entry.
    why: |
        The unseal share is the key to the vault holding the user's provider tokens and GitHub credential. The spec's headline invariant is that it never reaches disk; in the VM guest it always does, in a directory that survives the command whose entire purpose is discarding guest state.
    fix: |
        Add the fallback share (and root-token) files to `reset_guest_wipe_paths`, delete the OS-keychain entry in the same reset, and either restrict the fallback file to a tmpfs path or amend the `unseal-key-tmpfs-only` invariant to state the guest exception explicitly.
    evidence:
      - path: openspec/specs/tillandsias-vault/spec.md#L391-L393
        quote: '**Expression**: `/run/secrets/vault-unseal IS_ON tmpfs AND NEVER persisted to disk`'
      - path: crates/tillandsias-headless/src/vault_bootstrap.rs#L1310-L1313
        quote: '&& let Err(e) = fs::write( cache_dir.join(format!("fallback_{VAULT_SHAMIR_SHARE_V1}")), share_b64, )'
      - path: crates/tillandsias-headless/src/main.rs#L8746-L8748
        quote: 'fn reset_guest_wipe_paths(cache_dir: &Path) -> Vec<PathBuf> { vec![cache_dir.join("vault-data")] }'
    depends_on:
    upstream: ""

