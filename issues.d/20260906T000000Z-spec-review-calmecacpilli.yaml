  - id: 8dd0e5c5
    repo: tillandsias.org
    title: Nine requirements contradict their own scenario or a sibling requirement
    area: openspec/changes/add-level-page-specs/specs/site/level-{1,2,3,4,5}
    class: process
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        Each of these requirements is written to be applied by an editor who was
        not present when it was written, and openspec validate passes on all
        three changes, so nothing structural flags them.
    code: |
        Nine requirements instruct and forbid the same thing. Level 4's required
        sections open "in this order" and close by permitting the surface
        sections to be reordered, silently dropping the assurance-last constraint
        stated two sentences earlier. Level 4 lists the argument markers as
        optional, with dropping one explicitly not a regression, while "Rejected
        arguments stay on the page" makes a REFUTED mandatory. Level 4's
        hardening requirement governs a "hardening section" its own section list
        never defines. Level 3 makes it a MUST that each subsystem subsection say
        what falls short at the pin, and its own third scenario says a subsystem
        with nothing wrong keeps its subsection. Level 3 requires each unanswered
        item of a multi-item RED to be named in a scoped no-path clause and then
        makes the scoping optional in the next sentence. Level 5 requires each
        argument section to end with the flags that judge it while the same
        requirement declares markers optional and the page's first argument
        section carries none. Level 1's app-vocabulary requirement asserts the
        pinned source records a machine check of the promise it has just shown,
        and its third scenario forbids presenting that check as proof of that
        promise. Level 2 requires a cost sentence that its own platform
        requirement would forbid on Linux, and gives no precedence rule where
        "verbs match what the code does" and "the footnote target carries the
        claim" pull in opposite directions — the case that produced both rules.
    why: |
        A requirement that contradicts itself cannot be applied: an editor either
        picks a half and calls it compliance, or reads the whole spec as
        approximate. Three of these would license deleting true page content, and
        one would license writing a claim false on a supported platform. Nothing
        is published, so no reader is misled today; the damage is to the next
        editor, who is the reader these specs are written for.
    fix: |
        Resolve each pair in favour of the scenario, which is the half derived
        from the page: state ordering once and positively; carve the required
        markers out of the optional list by reference; anchor the hardening rule
        to the boundary section's hardening paragraphs; make the shortcoming
        clause conditional; say which no-path form governs and when scoping
        becomes required; make the flag rule a placement rule; reword the
        app-vocabulary MUST to permit a machine check only when the written
        promise it enforces is named; and add the missing precedence clause.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L26
        quote: The page MUST carry, in this order
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L37-L38
        quote: The surface sections MAY be reordered among themselves; the boundary section MUST be first.
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L56-L57
        quote: None of these is required, and dropping one MUST NOT be treated as a regression
        note: the argument markers, which the requirement quoted in finding 764caa09 makes mandatory.
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L80-L81
        quote: each saying what the reader gets and what falls short at the pin
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L103-L105
        quote: its subsection stays and says what it gives, rather than being deleted for having no RED
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L321-L322
        quote: each item either gets its remedy, or is named in a scoped no-path clause
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L325-L326
        quote: optionally with a scoping prefix or suffix naming which item it answers
      - path: openspec/changes/add-level-page-specs/specs/site/level-5/spec.md#L149
        quote: Each argument section MUST end with the flags that judge it
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L45-L47
        quote: MUST NOT present the check as proof of the promise the reader was shown
        note: the scenario that forbids what the requirement text at #L33-L35 instructs.
    depends_on:
    upstream: ""

  - id: cf6b4dff
    repo: tillandsias.org
    title: Every claim MUST carry a footnote resolving at the level's pin is false of both pages that state it
    area: openspec/changes/add-level-page-specs/specs/site/level-{1,4}
    class: doc-drift
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        Level 1 and level 4 both open their "Claims are no stronger than their
        source" requirement with the same sentence: every claim MUST carry a
        footnote resolving at the level's pin. Level 1's Purpose says the same of
        every sentence on the page.
    code: |
        The sentence is false of both pages and contradicted by the shared
        contract it sits under. level-common permits a footnote to point past the
        pin with an explicit @vTAG suffix, and both pages use it — the review
        counted roughly twenty @v56.9.5.1 footnotes on level 4 alone, none of
        which resolves at v56.9.2.1. Both pages also carry unfootnoted claims:
        level-1-five.md states its cloud framing and its doll-house mapping with
        no footnote marker at all, and the review lists three more lines there
        and three unfootnoted absolutes on level 4, none of them scheduled for
        repair in the change's tasks.md.
    why: |
        This is the first sentence of the requirement that governs every claim on
        the page, and it is contradicted by the shared contract, by the pages it
        describes, and — on level 4 — by another requirement in the same file
        that mandates PATH evidence at a newer tag. An editor either ignores it
        or deletes true prose to satisfy it. The specs are unpublished, so no
        reader is misled today; the pages themselves are unaffected by this
        finding, which is about what the spec says of them.
    fix: |
        Scope it: every factual claim about the runtime carries a footnote; a
        claim about the pinned release resolves at the pin, and a PATH clause
        reporting a newer build resolves at the tag its @vTAG names. Leave where
        and how footnotes resolve to level-common, and either schedule the
        unfootnoted lines or say that a section's framing sentence inherits the
        citations of the claims it introduces.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L152
        quote: Every claim MUST carry a footnote resolving at the level's pin
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L174-L175
        quote: Every claim MUST carry a footnote resolving at the level's pin and MUST be no stronger than the cited range.
      - path: openspec/changes/add-level-page-specs/specs/site/level-common/spec.md#L15-L18
        quote: A footnote MAY point past its level's pin only with an explicit `@vTAG` suffix
      - path: docs/matrix/level-1-five.md#L7
        quote: It is a doll house. Your computer is the table.
        note: one of the page's unfootnoted claims — the line carries no footnote marker.
    depends_on:
    upstream: ""

  - id: ecbe8175
    repo: tillandsias.org
    title: Universal MUSTs assert of the pages and of the audit record what is not true of them
    area: openspec/changes/add-level-page-specs/specs/site/level-{3,4,5}
    class: doc-drift
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        These requirements are written as descriptions of the pages they govern
        and of how the project works, in the register of a contract the page
        already satisfies.
    code: |
        Eight of them are false of their subject on the day they ship. Level 4
        states that audits of the page are run against a build newer than the
        pin; the page's own annotation file is scoped to the pin itself, and the
        current dated record says it re-verified every claim at the pin. Level 4
        requires promise, reason, price and purchase before the flags of every
        defended surface; the supply-chain heading is followed immediately by its
        first GREEN with no prose at all. Level 3 defines its required
        subsections as one per subsystem a launch brings up unconfigured, which
        by the page's own account excludes two of its eight subsections, and its
        add-or-remove scenario then licenses deleting them. Level 3's GREEN
        attribution MUST is broken by five of nine GREENs, and its "any list"
        MUST catches an illustrative naming of toolchains that nobody thinks is
        wrong. Level 5's closed section enumeration has no home for the live RED
        on the methodology's complexity constraint; its superlative ban forbids
        the theorem statements the page exists to make; and its Verdict rule
        requires every sentence there to restate an established claim, which the
        section's closing line does not.
    why: |
        A requirement falsified by its own subject teaches an editor that this
        spec's MUSTs are approximate — and several of these, applied literally,
        would have the editor delete true prose or a live RED to comply. The
        audit-premise sentence is worse than wrong: it reads as licence to
        distrust an at-the-pin audit, which is the steady state the update loop
        aims at. The specs are unpublished, so nothing here misleads a reader
        today.
    fix: |
        Scope each MUST to the case its own scenarios test, and make the audit
        premise conditional ("where an audit is run against a build newer than
        the pin"). Bind the Verdict rule to claims rather than sentences, the
        superlative ban to claims about the tree, the list rule to lists offered
        as the inventory of a bounded set, and widen level 3's subsection class
        to any subsystem a session reaches without the reader configuring it.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L302-L303
        quote: Audits of this page are run against a build newer than the level's pin
      - path: docs/matrix/level-4-security.audit.md#L5
        quote: "Audit scope: tillandsias runtime repo at v56.9.2.1."
        note: the page's own annotation file, scoped to the pin the requirement says audits are never run at.
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L98-L100
        quote: For each defended surface the page MUST state, before its flags, what the design promises, why the choice is defensible on its own terms, what it costs, and what that cost buys.
      - path: docs/matrix/level-4-security.md#L59-L61
        quote: "## Supply chain and provenance"
        note: the heading is followed by a blank line and then the section's first GREEN — no prose before the flags.
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L79-L80
        quote: one subsection per subsystem that a launch brings up unconfigured
      - path: openspec/changes/add-level-page-specs/specs/site/level-5/spec.md#L375-L376
        quote: Every sentence of the Verdict MUST restate a claim the sections above established.
      - path: docs/matrix/level-5-phd.md#L357
        quote: Use the mathematics. Discount the dashboard.
        note: the Verdict's closing line, which establishes and restates nothing.
    depends_on:
