# The specification review of 2026-09-05: eight page specs written that day
# (site/level-common, site/level-1..5, site/navigation), each reviewed by a
# second agent, every review returning `fail` — 62 defects across the six level
# and navigation reviews. Ten findings are recorded here: every defect of
# severity high or medium, grouped by the shape it repeats in. The low ones are
# wording nits and belong in the change's own tasks.md.
#
# Evidence resolves in THIS repository at commit 38bcc40, whose working tree
# carries the eight specs uncommitted (level-1..5 modified, site/navigation
# untracked); this repository has no tags, so `tag:` names the branch.
issues:
  - id: 0d88cfc7
    repo: tillandsias.org
    title: The level specs restate site/level-common's shared rules instead of referencing them
    area: openspec/changes/add-level-page-specs/specs/site
    class: process
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        site/level-common exists so that the shared rules are "stated once so the
        per-level specs can say only what is particular to their page", and each
        level spec defers to it by name where a rule is shared.
    code: |
        Eight defects across five reviews are one shape: the level spec restates
        the shared rule rather than referencing it. Level 1 re-asserts
        level-common's RED lifecycle in a scenario under a requirement that has
        just deferred to it, and its footnote-past-the-pin scenario is
        level-common's. Level 2 restates the RED lifecycle and narrows it — a
        replaced defect "MUST be written in the past tense", where level-common
        allows a past-tense flag or a GREEN — and then says its lifecycle is as
        level-common states. The cross-level same-source sentence is verbatim in
        both level 1 and level 2. The page-furniture ban appears in levels 1, 2,
        3 and 4. Level 3 copies level 1's footnote-target sentence verbatim, and
        reproduces the no-path sentence level-common already carries. Level 5
        restates level-common in four requirements (own pin, verdicts
        re-derived, sourcing, audit annotations), and states the
        newer-build/@vTAG rule three times inside its own file, a fourth in
        level-common and a fifth in level-5-stable-pin-deltas.
    why: |
        Normative copies drift independently: an editor correcting one leaves the
        others contradicting it, and level 2's copy already narrows what
        level-common permits, so two editors reading two specs reach opposite
        verdicts on the same fixed RED. Two of the duplicated rules are also
        cross-level by construction — a level cannot satisfy "cite the same
        source as the other level" alone — so no level spec is the right owner.
        Nothing here misleads a reader today: the specs are unpublished and
        govern no page yet. They are what the next update loop reads.
    fix: |
        Reduce each restating half to a reference to level-common, and move the
        two genuinely shared rules the level specs invented — levels agree on a
        source for a shared claim; page furniture lives in the LEVELS table —
        into site/level-common, so each level spec carries only its particular.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-common/spec.md#L3-L4
        quote: stated once so the per-level specs can
        note: level-common's Purpose, stating the rule the eight defects break.
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L225-L227
        quote: Where another level cites a source for the same claim, this page MUST cite the same source
      - path: openspec/changes/add-level-page-specs/specs/site/level-2/spec.md#L288-L290
        quote: Where another level cites a source for the same claim, this page MUST cite the same source
        note: the identical sentence in the second spec — a cross-level rule owned by neither.
      - path: openspec/changes/add-level-page-specs/specs/site/level-2/spec.md#L271-L272
        quote: A defect that the pinned code has already replaced MUST be written in the past tense
      - path: openspec/changes/add-level-page-specs/specs/site/level-common/spec.md#L64-L66
        quote: a RED the new pin's code has fixed becomes a past-tense flag or a GREEN
        note: the shared rule level 2 narrowed while claiming to defer to it.
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L252-L253
        quote: Each footnote MUST land on the range that states the claim its sentence makes
        note: verbatim from level-1/spec.md#L219-L220; level 4 carries a third near-copy.
    depends_on:
    upstream: ""

  - id: 3ed0ddf7
    repo: tillandsias.org
    title: Requirement text carries dated findings, counts and rosters that level-common forbids
    area: openspec/changes/add-level-page-specs/specs/site/level-{2,3,4},navigation
    class: process
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The shared contract forbids a page spec's requirement text from carrying
        a dated finding, a file count or a mandated verdict on a specific flag,
        and says such findings are work items in the change's tasks.md while the
        spec states the property the finding is an instance of.
    code: |
        Four specs do exactly what that requirement forbids. Level 4's "RED
        precision and scope" hard-codes three audit findings — a litmus corpus
        count down to the literal replacement phrase, a "(server-side branch
        protection)" scope that the page has already stopped using, and a
        mandated verdict on one named footnote — all three already tracked as
        work items in this change's own tasks.md. Level 3's survivorship
        requirement hard-codes a roster of artifacts two requirements after the
        same spec rejects prose rosters on principle, and the roster does not
        match the page: the host working copy it names appears on the page only
        inside a RED. Level 2 counts today's sources and headings into MUST text
        ("the two honest limits", "the page's four questions"). The navigation
        spec conditions a MUST NOT on a dated measurement of the runtime's
        local-ci.sh — a weight table over CI check names — which the review
        found half-superseded at the newest daily, where the arithmetic is run
        by a score-checks subcommand.
    why: |
        A requirement that names an instance duplicates the ledger and rots
        against it: it mandates a false number the moment the philosophy adds a
        limit, the page answers a fifth question or the litmus corpus grows, and
        the navigation clause is unappliable because the progress page has no pin
        and the answer differs by release. These are the specs' own stated rule
        being broken by the specs, not a claim to a reader: nothing is published,
        so no reader is misled today.
    fix: |
        Reduce each to the durable property it is an instance of — a number in
        prose is re-derived at the pin or replaced by the unquantified noun; a
        claim about state outside the repository is scoped to what the repository
        evidences; the page states what survives for every artifact whose fate it
        asserts — and leave the instances in tasks.md and the dated audit record.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-common/spec.md#L81-L83
        quote: MUST NOT contain a dated finding, an order or packet identifier, a ledger line number, a file count, or a mandated verdict on a specific flag
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L267-L268
        quote: a corpus count is the count at the pin or is replaced by "the litmus corpus"
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L268-L270
        quote: a claim about what happens outside the repository (server-side branch protection) is scoped to what the repository itself validates
      - path: openspec/changes/add-level-page-specs/specs/site/level-3/spec.md#L40-L42
        quote: the mirror volume and working copy, the vault's unseal material, the model cache
      - path: openspec/changes/add-level-page-specs/specs/site/level-2/spec.md#L48
        quote: state the two honest limits in the project's own philosophy
      - path: openspec/changes/add-level-page-specs/specs/site/navigation/spec.md#L324-L325
        quote: that figure is produced by a weight table over continuous-integration check names rather than by the arithmetic the runtime's own methodology defines
    depends_on:
    upstream: ""

  - id: 764caa09
    repo: tillandsias.org
    title: Requirements freeze today's verdicts, so a pin bump would make the spec mandate a false sentence
    area: openspec/changes/add-level-page-specs/specs/site/level-{1,4,5}
    class: process
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The level-5 spec states its own governing principle — this spec requires
        the form of the verdicts and never a particular verdict — and
        level-common orders that a RED the new pin's code has fixed becomes a
        past-tense flag or a GREEN.
    code: |
        Three requirements do the opposite, and the reviews show two of them
        already falsified one release forward. Level 4 makes a REFUTED permanent
        and unconditional, with no pin condition, while the page's only REFUTED
        says the hardening litmus cannot fail at this release — a claim the
        change's own tasks.md 4.16 records as no longer holding on the newer
        build. Level 5's section enumeration mandates today's conclusions rather
        than the object each section covers: item 4 requires the gap between what
        the repository asserts of the operator and what the theorem needs, item 6
        requires the law-of-large-numbers family the doctrine invokes and the
        hypothesis the architecture violates by design; the review found both
        falsified at the only candidate pin, where the workspace property-tests
        monotonicity of refine and the methodology withdraws its strong-LLN
        claim. Level 1 requires the method section to carry an honest limit that
        exists only because the pinned methodology currently withholds a metric
        proof.
    why: |
        At the next pin bump each of these compels the page to keep a sentence
        its source no longer supports — the precise failure level-common's RED
        lifecycle exists to prevent — or leaves the page unable to comply without
        inventing a defect. The level-5 case also reverses this change's own
        completed task 2.6, which stripped mandated verdicts out of every
        requirement. Nothing is published, so no reader is misled today; the cost
        falls on the first editor to move a pin.
    fix: |
        Condition each on the pin, as level 5's "Verdicts are re-derived, never
        frozen" already does: name the section's object and the job it does and
        let the conclusion be a fact of the pin; keep a REFUTED while it holds at
        the pin and restate it in the past tense, naming the release that changed
        it, when the pin moves; and require the limit the cited methodology
        records at the pin rather than today's wording of it.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-5/spec.md#L413-L414
        quote: This spec requires the form of the verdicts and never a particular verdict
      - path: openspec/changes/add-level-page-specs/specs/site/level-5/spec.md#L88-L91
        quote: the law-of-large-numbers family the doctrine invokes, which member the situation actually needs
        note: item 6 of the section enumeration, mandating an analysis of a family the doctrine no longer invokes at the candidate pin.
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L283-L285
        quote: the page MUST keep it as a REFUTED line, stated in the words someone would use to propose it
      - path: docs/matrix/level-4-security.md#L14
        quote: At this release the test cannot fail, so a pass says nothing about the flags.
        note: the page's only REFUTED — the sentence the requirement above would make permanent.
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L72-L73
        quote: its honest limit (getting less broken is not the same as ending up perfect)
    depends_on:
