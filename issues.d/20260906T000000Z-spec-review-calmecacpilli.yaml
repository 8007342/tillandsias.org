  - id: 6767e64d
    repo: tillandsias.org
    title: The wording rules do not reach footnote labels, and the disagreement remedy prefers the wrong half
    area: openspec/changes/add-level-page-specs/specs/site/level-2, docs/matrix/level-2-phone.md
    class: process
    severity: high
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The level-2 spec's wording rules govern "a reassuring sentence", "the
        page" and "the visible sentence", and its "Prose and tooltip disagree"
        scenario resolves a conflict between the two by correcting the sentence
        to the footnote's terms or re-anchoring the footnote.
    code: |
        A footnote's label is author-written prose the reader sees on hover and
        in the rendered list, and the checked build verifies only path, range and
        quote — never the label. So the one surface the build cannot check is
        also the one the spec does not govern, and the consequence is live: the
        verification pass withdrew the false reassurance from the page's prose,
        which now says secrets are re-registered at every start, while [^5]'s
        label still tells the reader they are removed and reissued so that an
        unclean shutdown leaves nothing stale — the invented staleness property
        this spec's own "Reassurance is bounded by the cited source" forbids.
        Both remedies in the disagreement scenario treat the footnote as the
        correct half, so an editor applying it would restore the withdrawn claim
        into the sentence.
    why: |
        This is the one defect of the eight specs that touches published text: a
        false reassurance is on the live page today, in the surface the build
        does not check, and the spec written to prevent exactly that failure
        leaves the surface ungoverned and then points the remedy at the wrong
        half. Finding 1e141597 records the same label from the annotation-file
        angle; this one is about the rule that was supposed to catch it.
    fix: |
        Say once, in this spec, that a footnote's label is page prose bound by
        every wording and sourcing rule here, as PATH, GREEN and RED text are.
        Add the third remedy — the label is rewritten to what the cited range
        states — and order the remedies by which half the pinned source supports
        rather than by which half is the footnote. Add a scenario: when a claim
        is withdrawn from a sentence, the label of every footnote attached to it
        is checked for the same claim.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-2/spec.md#L150-L151
        quote: A reassuring sentence MUST claim only the outcome its cited range states
      - path: openspec/changes/add-level-page-specs/specs/site/level-2/spec.md#L205-L206
        quote: the sentence is corrected to the footnote's terms, or the footnote is re-anchored to a source that states the sentence
      - path: docs/matrix/level-2-phone.md#L60
        quote: Internal secrets are removed and reissued at every start, so an unclean shutdown leaves nothing stale
        note: the label of [^5], live on the page, carrying the claim the prose withdrew.
    depends_on:
    upstream: ""

  - id: e2e95e62
    repo: tillandsias.org
    title: Two register MUSTs name no criterion an editor could apply
    area: openspec/changes/add-level-page-specs/specs/site/level-{1,4}
    class: process
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        Level 1's register requirement and level 4's layer requirement are stated
        as MUSTs, which the change's tasks.md treats as checkable by an editor
        reviewing the page.
    code: |
        Three clauses give nothing to check against. "One metaphor family" leaves
        family undefined, and the page mixes doll-house imagery, household and
        postal imagery and a literal UI element, so the MUST is either already
        breached or unenforceable. "Machine vocabulary" names no list, on a page
        whose own subject is that two different banned-word lists exist and
        differ. Level 4's requirement that a mitigation be criticised "without
        the criticism being softened" offers no test at all.
    why: |
        An unappliable MUST is either ignored, which teaches that the rest are
        optional, or used to justify an arbitrary edit; the metaphor clause's
        first use would be to delete prose that works. Nothing is published, so
        no reader is misled today.
    fix: |
        Keep the enforceable rule level 1 already states — one metaphor per
        object, and no second metaphor for an object that has one — and drop
        "one metaphor family". Define the vocabulary ban by reference to the
        banned-word lists the pinned source records, noting that more than one
        exists and the prose must avoid the union. Delete the "softened" clause,
        whose intent the scenario about what a cost bought already carries.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L128
        quote: The page MUST hold one metaphor family across its whole length
      - path: openspec/changes/add-level-page-specs/specs/site/level-1/spec.md#L131
        quote: Its own prose MUST NOT use machine vocabulary
      - path: openspec/changes/add-level-page-specs/specs/site/level-4/spec.md#L102-L103
        quote: a mitigation MUST be criticised without the criticism being softened
    depends_on:
    upstream: ""

  - id: 1e3f8c3d
    repo: tillandsias.org
    title: The navigation spec describes a progress board the build does not produce
    area: openspec/changes/add-level-page-specs/specs/site/navigation, scripts/build-matrix.py
    class: doc-drift
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The navigation spec requires the board to place every finding in exactly
        one of three columns whose blurbs a reader who has never opened the
        ledger can apply, to show per finding whether it has been filed where it
        has to go, to show when each was first recorded and last moved, and to
        order each column by a rule the build states.
    code: |
        Three of those do not hold. The ledger's lateral terminals, obsoleted and
        wontfix, are not ladder rungs and are placed in the middle column by the
        fold, but the spec's middle-column blurb requires that a plan of work
        exists and the left requires found-and-not-yet-tracked, so such a card
        matches no blurb the page states. The filing state is computed and then
        discarded: build-matrix.py builds the filed-or-unfiled markup into `up`
        and appends it behind a literal `if False`, and would emit it as a
        sibling list item outside the card even if the guard were flipped, so no
        card on the published board carries a filing link or says "not filed
        upstream". A finding whose events carry no timestamp renders as a blank
        meta field rather than as explicitly undated, and the ordering rule
        (severity, then id) exists only as a Python sort key.
    why: |
        The requirement the board exists for — an unfiled finding MUST NOT be
        displayed in a way that lets it read as filed — is unmet by omission for
        every runtime finding on the live board, mitigated only by the aggregate
        "0 filed upstream" tally beside it. The column defect is in the opposite
        direction: the spec is unpublished and the fold already does something
        defensible, but the blurb a reader is told to apply and the placement the
        code performs disagree, so the first wontfix will be misfiled by the
        page's own definition.
    fix: |
        In the build, drop the `if False` and emit the filing state inside the
        card. In the spec, name where a lateral terminal sits in the ledger's own
        terms — on the board, never in the right-hand column, its card saying the
        attempt ended without completion — widen the middle column's stated
        meaning to cover it, require a finding with no chronology to render as
        undated rather than blank, and say where the ordering rule is stated.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/navigation/spec.md#L306-L307
        quote: an unfiled finding MUST NOT be displayed in a way that lets it read as filed
      - path: scripts/build-matrix.py#L499
        quote: up) if False else
        note: the tail of card(), where the filed-or-unfiled markup is discarded unrendered.
      - path: issues.d/README.md#L52
        quote: are **lateral terminals**, not rungs
      - path: openspec/changes/add-level-page-specs/specs/site/navigation/spec.md#L230-L232
        quote: where a plan of work exists and uncertainty is low enough to act on
        note: the middle-column blurb, which a wontfix finding placed there does not satisfy.
      - path: openspec/changes/add-level-page-specs/specs/site/navigation/spec.md#L284-L285
        quote: MUST show when it was first recorded and when it last moved
    depends_on:
    upstream: ""

  - id: 64d733d3
    repo: tillandsias.org
    title: The Home positioning line makes a claim no level page footnotes
    area: openspec/changes/add-level-page-specs/specs/site/navigation, scripts/build-matrix.py
    class: doc-drift
    severity: medium
    tag: main
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The navigation spec's scenario for the positioning line says that where
        it makes a claim about what the software does, it says only what a level
        page already carries with a footnote, in words no stronger, and short
        enough that the two can be compared at a glance.
    code: |
        The line the build ships is a verbatim copy of the "What is it?" hero
        lede, which is page furniture carrying no footnote. The review reports
        that a grep across the level pages finds none of "Local hardware",
        "rented", "metered" or "left behind"; two of the line's clauses map
        loosely onto footnoted level-2 sentences, and "nothing left behind" maps
        onto nothing at all. The scenario names no level sentence to compare
        against and no party to do the comparing, so neither the build nor a
        reviewer can fail it.
    why: |
        This is the requirement in the navigation spec that governs a claim on
        the live Home page, and as written it neither identifies its source nor
        is checkable — the clause it exists to keep honest has no footnoted
        counterpart anywhere on the site. Unlike the rest of this review's
        findings, the sentence it fails to govern is published.
    fix: |
        Bind the positioning line to a named source — it repeats one sentence a
        level page carries with its footnote, and an editor can point at that
        sentence — or govern the hero lede in this spec as well, so the two
        copies have one owner. Then move the unbacked clause onto a level page
        with a footnote, or drop it.
    evidence:
      - path: openspec/changes/add-level-page-specs/specs/site/navigation/spec.md#L175-L176
        quote: it says only what a level page already carries with a footnote, in words no stronger
      - path: scripts/build-matrix.py#L455
        quote: Local hardware. Free software. Nothing rented, nothing metered,
        note: the shipped positioning line, duplicated from the hero lede, which carries no footnote.
    depends_on:
    upstream: ""
