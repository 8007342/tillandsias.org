  - id: d0c34ed6
    repo: tillandsias.org
    title: Nothing tells this repository that the runtime published a release
    area: skills/update-website/scripts/latest-release.sh
    class: defect
    severity: medium
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The skill's second automation candidate is the same drift report, fired
        when the runtime publishes a release, either by the release workflow
        pinging this repository or by a cron that polls tags.
    code: |
        latest-release.sh resolves both channels correctly and cheaply, stable from
        the releases endpoint with cache-busting and a cross-check against the git
        tag, unstable over git ls-remote with no API call at all. It is polled by a
        human who remembers to run the loop.
    why: |
        Dailies land daily, the pages pin stable, and stable moves only on
        promotion — so the event worth waking up for is rare and easy to miss.
        During that window the site's PATH lines say a fix is not yet promoted
        about things that are promoted, which is the one lie this design exists to
        avoid.
    fix: |
        A cron entry on a host session running drift-report.sh and reporting to the
        operator whenever its last line is not ok:up-to-date; plan/host-notes.md is
        the channel a host session already has. A ping from the runtime's release
        workflow is better and belongs on the runtime's side of the fence, which
        makes it a request rather than a task.
    evidence:
      - path: skills/update-website/scripts/latest-release.sh#L1-L8
        quote: Print the newest Tillandsias release tag on a channel.
      - path: skills/update-website/SKILL.md#L101-L102
        quote: Same report, fired when the runtime publishes a
    depends_on:
      - 3d0ef7e2
    upstream: ""

