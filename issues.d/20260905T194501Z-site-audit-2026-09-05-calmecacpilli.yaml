        The level-3 spec says the page is the anatomy — what runs where, what
        survives a teardown, and where the sharp edges are — and at c4039e1 carries
        four requirements: enclave anatomy, survivorship claims, every RED true at
        the pin, and gate and CI statements.
    code: |
