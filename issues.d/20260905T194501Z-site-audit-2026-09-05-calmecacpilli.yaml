    area: images/default/lib-common.sh, spec subdomain-naming-flip
    class: doc-drift
    severity: medium
    tag: v56.9.5.1
    commit: b528680d2b938b09279e31faee981a8f6e370b3b
    claim: |
        The subdomain-naming-flip requirement stands at both tags and mandates
        service.project.localhost for every URL that names a forge service.
    code: |
        The startup-context generator in images/default/lib-common.sh still emits
        the pre-flip shape — project.service.localhost — in the dev-server
        paragraph, at L4223 in v56.9.2.1 and at L4535 in v56.9.5.1, so every agent
        in every forge reads it. The browser MCP enforces the flipped shape and
        refuses any other host. The publishing paragraph a few lines below the
        stale one is correct, and so is the copy that lands in a project's
        .forge-startup-context.md, which is this file's output.
    why: |
        An agent that follows the context file hands its user a hostname the router
        has no route for and the browser tool refuses by shape, then debugs a dev
        server that looks dead. This is the fourth documented case of the startup
        context misinforming an agent — the vault address, the on-demand
        attestation claim and the Local Experts mode are already flagged on the
        site's level-3 page — and the only one that hands the agent a wrong
        artifact to give the user rather than a wrong belief about a service.
    fix: |
        Swap the two labels in images/default/lib-common.sh so the line reads
        service.project.localhost. The file is generated into each project and
        gitignored there, so nothing in the website repository can fix it: it is
        filed here alongside the vault-address and attestation entries, and the
        site's level-3 context-file RED picks it up at the next re-verification.
    evidence:
      - path: images/default/lib-common.sh#L4535
        quote: user \`http://${project_name}.<service>.localhost/\` (no port). Full
      - path: openspec/specs/subdomain-naming-flip/spec.md#L19
        quote: All URLs referencing forge services MUST use the pattern `<service>.<project>.localhost`
    depends_on:
    upstream: ""

