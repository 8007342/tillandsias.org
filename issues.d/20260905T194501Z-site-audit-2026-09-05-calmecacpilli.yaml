  - id: 576200f9
    repo: tillandsias.org
    title: The level-5 deltas are live on the site while their OpenSpec change is unapproved, and openspec/specs/ holds no site spec
    area: openspec/changes/level-5-stable-pin-deltas, openspec/specs
    class: doc-drift
    severity: medium
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The level-5 delta discipline says an editor may apply the deltas a change
        lists, and that the operator reviews the change before it is archived. The
        record of the work says the remaining deltas are waiting on the operator.
    code: |
        The seven applied deltas D1-D7 are live: eleven of the thirteen task boxes
        in openspec/changes/level-5-stable-pin-deltas/tasks.md are [x], and the two
        that are not are the proposed deltas D8 and D9, which the same file says
        wait for the operator rather than for an editor. The prose and the four
        @v56.9.5.1 footnotes [^41]-[^44] are in docs/matrix/level-5-phd.md, and the
        result is in var/html/index.html, which Cloudflare serves on commit.
        Meanwhile openspec/specs/ and openspec/changes/archive/ each hold only
        .gitkeep, so no site capability has ever been promoted out of changes/ and
        the current contract for every level lives in one of the three unarchived
        changes there.
    why: |
        Applying before approval is permitted, so this is an unclosed loop rather
        than a violation. It matters because the reviewable artifact and the
        published artifact have drifted apart in status: a reader of openspec/
        cannot tell which of the three open changes describe the live site and
        which are proposals, and openspec/specs/site/level-5/ — where the next
        editor would look for the page's contract — does not exist. The longer the
        change sits, the more the next audit's deltas pile onto an unreviewed base.
    fix: |
        The operator reviews level-5-stable-pin-deltas and archives it, together
        with add-level-page-specs, whose task 3.3 names the same sync, so that
        openspec/specs/site/level-{common,1..5}/ become the current contract and
        changes/ holds only what is genuinely proposed.
    evidence:
