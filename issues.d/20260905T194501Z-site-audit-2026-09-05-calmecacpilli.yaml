  - id: 778a9057
    repo: tillandsias.org
    title: The only page build is Python, which the runtime methodology forbids for committed automation
    area: scripts/build-matrix.py, scripts/figures.py, scripts/issues.py, skills/update-website/scripts
    class: spec-vs-code
    severity: high
    tag: cb07e89
    commit: cb07e89c411e6c63abb8995928ed9a6da34ddc8c
    claim: |
        The runtime methodology, identical at both tags, forbids Python for
        runtime, harness or repository scripts, allows Rust and POSIX shell that
        dispatches existing binaries, and requires explicit approval from the
        operator before an exception is committed or used by recurring automation.
    code: |
        This repository's page generator is 1,185 lines of Python plus 372 more of
        inline-SVG figures, and the ledger fold the page now renders adds a third
        file of 392; package.json wires the generator to npm run build; and two
        committed skill scripts, checked-build.sh and drift-report.sh, invoke it on
        every run of the update loop. That is recurring automation. The convention
        is written down in skills/README.md as an inheritance argument rather than
        an approval, and the rule's own checker resolves the repository root with
        git rev-parse and so has only ever scanned the runtime repository. No
        recorded approval was found in either repository.
    why: |
        The site is the project's public argument that it says what is true about
        itself, and the security level's whole case is that promises are
        machine-checked. A methodology rule this repository quietly does not follow
        is something a reader of that page is entitled to know about, and it is a
        live risk: the day the checker learns about sibling repositories, the build
        breaks and the page cannot be regenerated. A Rust rewrite is the approved
        path and is not small — the markdown dialect, seven callout kinds, the
        footnote parser with its release-override suffix, the checked-build
        resolver, the ledger fold and the whole template, with byte-identical
        output as the acceptance test — and a POSIX-shell port is not permitted by
        the rule's own wording, since it would not be dispatching an existing
        binary.
    fix: |
        Ask the operator for the explicit exception the rule provides for, and
        record it beside the build command in docs/matrix/README.md, naming the
        three files it covers and the condition — no new Python, replacement in
        Rust when the page generator is next touched substantially.
    evidence:
      - path: docs/audit/2026-09-05-issues-tillandsias.org.md#L305-L311
        quote: Python is not allowed for Tillandsias runtime, harness, or repository
      - path: package.json#L6
        quote: '"build": "python3 scripts/build-matrix.py",'
      - path: skills/README.md#L18-L23
        quote: runtime's methodology forbids Python for its own committed automation, and this
    depends_on:
    upstream: ""

  - id: a988d3c4
