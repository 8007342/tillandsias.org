  - id: 52c8f180
    repo: tillandsias.org
    title: Nothing runs the checked build before a push, so a broken footnote can be published
    area: skills/update-website/scripts/checked-build.sh, .git/hooks
    class: defect
    severity: high
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The update-website skill requires the checked build to pass before
        publishing, and the matrix rules say a footnote that 404s is worse than no
        footnote and a drifted quote is worse than a 404.
    code: |
        checked-build.sh does exactly what it promises and nothing runs it. There
        is no .githooks directory and .git/hooks holds only the stock samples,
        there is no .github/ in this repository, and wrangler deploys committed
        assets with no build step — so a push to main publishes whatever
        var/html/index.html contains. Both qualities are a matter of the author
        remembering.
    why: |
        This is the whole class the trial build measures: if the five pins were
        moved to the newest daily without re-verification, 125 of the 342 footnote
        targets would resolve to a range that no longer contains their quote. One
        rule the gate still could not check is that every RED is followed by a
        PATH, which no script enforces today; a lint would be ten lines, and must
        read "followed by" as "before the next RED or GREEN", since on level 4 one
        REFUTED sits between a RED and its PATH — the only such case on the site,
        and every one of the thirty-nine REDs is answered today.
    fix: |
        A tracked .githooks/pre-push that runs checked-build.sh and refuses on a
        non-zero exit, plus a one-line installer setting core.hooksPath and a line
        in the skill telling a fresh forge to run it. Fail closed when the
        checkouts are absent: an unchecked level is not a checked build.
    evidence:
      - path: skills/update-website/scripts/checked-build.sh#L4
        quote: missing: an unchecked level is not a checked build.
      - path: docs/matrix/README.md#L14-L15
        quote: a footnote that 404s is worse than no footnote, and a quote
    depends_on:
    upstream: ""

