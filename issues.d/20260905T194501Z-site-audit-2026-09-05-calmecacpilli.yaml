    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The skill's step 5 tells the editor to correct targets, quotes and prose in
        the level's source, following the audit-site-claims procedure per level.
    code: |
        The tooling reports that a quote left its range and never says where the
        quote went, yet for almost all of it the answer is one command. The day's
        record measured 112 moved and 9 gone out of 121 breakages; re-measured
        against the same daily at c4039e1, after the pages grew, it is 125
        breakages of which 116 are the same characters elsewhere in the same file
        and need only a new line range, and 9 are genuinely gone and need a human
        to write new prose. No such helper exists in
        skills/update-website/scripts, which holds five scripts.
    why: |
        It removes toil, and toil is what makes a pin bump get postponed. It is
        also the precondition for a delta generator: a generator can only list one
        delta per drifted footnote if something can compute the new target.
    fix: |
        A re-anchor.sh taking a level and a tag, about sixty lines of shell over
        grep, sed and git, parsing footnote definitions the way the build does and
        printing one of three verdicts per broken target — moved with the new
        range, relocated to another file, or gone — as a paste-ready block.
    evidence:
      - path: skills/update-website/SKILL.md#L73-L74
        quote: Checked build must pass.
      - path: docs/audit/2026-09-05-issues-tillandsias.org.md#L630-L636
        quote: 112 have simply moved
