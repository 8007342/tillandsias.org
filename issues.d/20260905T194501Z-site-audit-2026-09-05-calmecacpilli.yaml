    title: The level-5 delta change is assembled by hand every time
    area: openspec/changes/level-5-stable-pin-deltas
    class: defect
    severity: low
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The skill's fifth candidate is to produce the OpenSpec change for level 5
        with the exact deltas and evidence, never the edit. The requirement it
        serves is one delta per requirement, flag or footnote touched, each with a
        line-range citation and a verbatim quote at the target tag.
    code: |
        The change filed that day was assembled by hand: seven applied deltas
        D1-D7, four new footnotes [^41]-[^44], twenty-eight verbatim quotes added
        under the in-repo footnotes, and a task list whose every line had to be
        verified twice. Most of that is generable — the drift set, the new anchors,
        the quote text at the target tag, and the skeletons of proposal.md and
        tasks.md.
    why: |
        The failure the level-5 spec names — the page's diff containing a hunk that
        no delta lists — is detectable only if the change lists everything the diff
        should contain, and a generator that starts from the drift set does that by
        construction.
    fix: |
        About 120 lines on top of the re-anchor helper: take a target tag, diff the
        cited-file set, read level 5's rows out of a trial build at that tag, and
        emit the change directory with a proposal, one unchecked box per delta and
        the minimal delta spec validation insists on. It must never touch
        docs/matrix/level-5-phd.md; stopping short is the point.
    evidence:
