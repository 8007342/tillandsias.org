    upstream: ""

  - id: e87c4f45
    repo: tillandsias.org
    title: Per-level re-verification is unautomated, and is the part that must stay reviewed
    area: skills/audit-site-claims/SKILL.md
    class: defect
    severity: low
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The skill's fourth candidate is an agent per level running the
        audit-site-claims procedure, then a skeptic per level, then a human or a
        second agent reading the diff — needing a model, not free, and the part
        that should stay reviewed.
    code: |
        The 2026-09-05 run did it by hand and at scale: an auditing agent per slice
        of the work and a skeptic per slice whose refutations overrode the audit,
        then a writer, a reviewer and a corrector per level. The record says why
        the skeptic pass is not optional — several corrections came from it rather
        than from the first pass, including the two sibling scripts that still
        create the enclave network without the isolation flag and the withdrawal of
        a commit-count figure.
    why: |
        This is the class of claim no script can check: a RED still literally true
        but no longer honest, prose that outran its footnote, a PATH line promising
        something the ledger has closed. It should be the last candidate automated
        and the first to keep a human on.
    fix: |
        Not a fix but a sequencing decision: automate the pre-push gate, the
        forecast and the re-anchor helper first, so that when agents do run, the
        objective failures are already impossible; then fan out one agent per level
        with a skeptic each, and gate publication on a human reading the diff.
    evidence:
      - path: docs/audit/2026-09-05-v56.9.2.1.md#L521-L526
        quote: was given to an auditing agent that had to name a file
      - path: skills/update-website/SKILL.md#L106-L107
        quote: An agent per level with the
    depends_on:
      - 52c8f180
      - 3d0ef7e2
      - 296676d4
    upstream: ""

  - id: 373585f1
    repo: tillandsias.org
    title: The published site cannot be reached from a forge, so no claim about it was verified as served HTML
    area: docs/audit, and the proxy allowlist in the runtime
    class: process
    severity: low
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The audit verifies what a reader of tillandsias.org sees, and the update
        loop ends by publishing to it.
    code: |
        The site is not reachable from the forge that builds it: the connection is
        reset, because the proxy allowlist is baked into the proxy image and the
        project's own domain reached it only in the daily channel. So every claim
        in the day's records about what a reader sees rests on the committed
        var/html/index.html and its rebuild hash, not on served HTML.
    why: |
        The last link in the chain is unverified. A build can be byte-identical to
        the committed artifact and the served page still differ — a stale cache, a
        misrouted deployment, a worker that never took the commit — and nothing in
        this repository would notice. It is also the only claim class the checked
        build cannot reach, so it will stay unverified until a session outside the
        stable image looks.
    fix: |
        Until a forge on a release carrying the allowlist entry can fetch the site,
        have a host session or the operator fetch the published page and compare
        its hash with the committed artifact, and record the comparison in the
        run's record beside the rebuild hash.
    evidence:
      - path: docs/audit/2026-09-05-v56.9.2.1.md#L564-L567
        quote: is not reachable from this
      - path: docs/audit/2026-09-05-v56.9.2.1.md#L566-L567
        quote: so the pages were verified as source and as a local build, not as served HTML.
      - path: images/proxy/allowlist.txt#L205-L215
        note: Read in the two runtime checkouts rather than in this repository, so it is our reading and not a checked quotation - the stable tree carries no entry for the domain at all, and the daily adds a leading-dot entry for it under a comment recording exactly this failure.
    depends_on:
    upstream: ""
