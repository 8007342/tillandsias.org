  - id: 3d8dffde
    repo: tillandsias.org
    title: The pages are 48% longer in prose than yesterday, and the length expectation is written down nowhere
    area: docs/matrix, openspec/changes/add-level-page-specs/specs/site/level-common
    class: doc-drift
    severity: medium
    tag: c4039e1
    commit: c4039e18f5533054f368b9836867655880d55c09
    claim: |
        The editorial rules that are written down constrain shape, not size: one
        merged narrative per level, implementation trivia is not substance, a page
        that is all flags has stopped being prose. None of them constrains length,
        and a search for length, shorter, longer, concise and brev across docs,
        openspec, skills and scripts returns no rule.
    code: |
        Prose words outside the footnote definitions and their quote lines went
        from 8,277 at bf5bde3, the last commit of 2026-09-04, to 12,240 across the
        five levels — a factor of 1.48 — and footnote definitions from 105 to 342.
        Level 3 more than tripled, 1,034 words to 3,681, and its new capability
        inventory is 2,119 of those 3,681. The spread between the shortest and the
        longest level is essentially unchanged, 6.6x before and 6.5x after.
    why: |
        The operator asked for the capability inventory, and an inventory is a
        completeness claim: it is worth having because it enumerates, and cannot be
        halved without becoming a sample. The unwritten length norm has no recorded
        justification and nothing checks it, so the next editing agent is guessing
        at a rule it cannot read.
    fix: |
        One requirement in the level-common spec stating the argument/reference
        split — levels 1 and 2 stay readable in one sitting, levels 3 to 5 are as
        long as their subject provided every section earns its place under the
        rules that already exist — so the next editor is bound by a written rule.
    evidence:
      - path: docs/matrix/README.md#L60-L86
        quote: Rules that are not style preferences
      - path: docs/matrix/README.md#L82-L83
        quote: Implementation trivia is not substance.
    depends_on:
    upstream: ""

  - id: 077e5ab2
